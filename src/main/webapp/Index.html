<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #2f3640;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .caja {
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        h1 {
            color: #273c75;
            font-size: 22px;
            margin-top: 0;
            text-align: center;
        }
        label {
            display: block;
            margin: 12px 0 4px;
            color: #333;
            font-size: 14px;
        }
        input[type=email], input[type=password] {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 18px;
            width: 100%;
            padding: 10px;
            background: #273c75;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #1e3163; }
        .error {
            background: #ffe3e3;
            color: #c0392b;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }
        .ayuda {
            margin-top: 16px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="caja">
    <h1>Iniciar sesión</h1>

    <div id="mensajeError" class="error"></div>

    <!-- Punto 1: Formulario HTML con correo y clave -->
    <form action="login" method="post">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required>

        <label for="clave">Clave</label>
        <input type="password" id="clave" name="clave" required>

        <button type="submit">Ingresar</button>
    </form>

    <p class="ayuda">Prueba: admin@empresa.com / 1234</p>
</div>

<script>
    // Muestra mensajes según el parámetro "error" de la URL (Punto 4)
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    const caja = document.getElementById("mensajeError");
    if (error === "1") {
        caja.textContent = "Credenciales incorrectas. Verifica el correo y la clave.";
        caja.style.display = "block";
    } else if (error === "2") {
        caja.textContent = "Debes iniciar sesión para ver la lista de empleados.";
        caja.style.display = "block";
    }
</script>
</body>
</html>
